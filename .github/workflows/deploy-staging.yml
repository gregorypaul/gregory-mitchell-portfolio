# Deploy the Vite build to the staging folder on HostGator over FTP.
# Runs on every push to staging, and when started by hand from the Actions tab.
# A manual run only uploads when it is started from staging.
# Any other branch is skipped, so a pull request cannot write to the server.
#
# Same secrets as .github/workflows/deploy.yml:
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#
# Prod uploads to FTP_SERVER_DIR (default ./public_html/).
# Staging uploads to that directory plus staging/ (default ./public_html/staging/).
# If the FTP account is already rooted inside public_html, FTP_SERVER_DIR is ./
# and staging lands in ./staging/. The value must end with /.
#
# Sync state is .ftp-deploy-sync-state-staging.json so it does not collide
# with prod's .ftp-deploy-sync-state.json.

name: Deploy staging to HostGator

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostgator-ftp-staging
  cancel-in-progress: false

env:
  FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || './public_html/' }}

jobs:
  deploy:
    name: Build and upload
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Block search indexing
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          find dist -name '*.html' -print0 | xargs -0 sed -i 's|<head>|<head>\n    <meta name="robots" content="noindex, nofollow">|'
          # cPanel Directory Privacy owns .htaccess in public_html/staging.
          # Never upload one from this build.
          find dist -name '.htaccess' -delete
          find dist -name '.htpasswd' -delete

      - name: Set staging server directory
        run: |
          base="${FTP_SERVER_DIR%/}/"
          echo "FTP_STAGING_DIR=${base}staging/" >> "$GITHUB_ENV"

      - name: Upload dist over FTP
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          # Whole Vite build, including dist/websites/index.html (/websites/).
          # Do not add websites/ to exclude.
          local-dir: ./dist/
          server-dir: ${{ env.FTP_STAGING_DIR }}
          state-name: .ftp-deploy-sync-state-staging.json
          # Must stay false. true deletes everything in server-dir first,
          # including the cPanel Directory Privacy .htaccess and .htpasswd.
          dangerous-clean-slate: false
          # Excluded paths are left out of both upload and delete.
          # .htpasswd normally lives outside public_html; exclude it anyway
          # so a copy inside staging/ is never replaced.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.htaccess
            **/.htpasswd
            .htaccess
            .htpasswd
            **/dishly/**
            **/movie-app/**
            **/bon-appetit/**
            **/bon-appetite/**
            **/cgi-bin/**
            **/.well-known/**
