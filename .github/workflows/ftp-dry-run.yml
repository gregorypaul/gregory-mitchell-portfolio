# Read-only FTP check. dry-run: true logs in and prints the upload plan.
# It does not create, replace, or delete files on the server.
# This file runs on the pull-request branch only, never on main.
# The production upload is .github/workflows/deploy.yml and only runs on main.

name: FTP dry run

on:
  push:
    branches:
      - cursor/portfolio-accuracy-local-seo-39d9

permissions:
  contents: read

concurrency:
  group: hostgator-ftp-dry-run
  cancel-in-progress: true

jobs:
  dry-run:
    name: Authenticate and list uploads
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: FTP dry run
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ./public_html/
          dry-run: true
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.htaccess
            **/dishly/**
            **/movie-app/**
            **/bon-appetit/**
            **/bon-appetite/**
            **/cgi-bin/**
            **/.well-known/**
